<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Happiee Knots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: var(--color-gray-50); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: 'Inter', sans-serif;}
        .auth-container { display: flex; align-items: center; justify-content: center; flex: 1; padding: 2rem; background: var(--color-pink-50); }
        .admin-auth-card { background: var(--color-white); padding: 3rem; border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 420px; width: 100%; border: 1px solid var(--color-pink-200); }
        
        .logo { display: flex; align-items: center; gap: 8px; font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 500; text-decoration: none; color: var(--color-black); justify-content: center; margin-bottom: 1.5rem; }
        .logo-main { font-weight: 800; color: var(--color-pink-600); }
        .logo-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background-color: var(--color-pink-100); border: 2px solid var(--color-pink-300); padding: 4px; }
        
        .admin-auth-card h2 { font-size: 1.8rem; margin-bottom: 2rem; color: var(--color-black); }
        
        .admin-form-group { margin-bottom: 1.25rem; text-align: left; position: relative;}
        .admin-form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--color-gray-700);}
        
        .admin-input { width: 100%; padding: 0.75rem; border: 1px solid var(--color-gray-300); border-radius: var(--radius-md); font-family: inherit; font-size: 0.95rem; outline: none; transition: var(--transition); box-sizing: border-box;}
        .admin-input:focus { border-color: var(--color-pink-500); box-shadow: 0 0 0 3px var(--color-pink-50); }
        .admin-input:focus::placeholder { color: transparent; transition: color 0.2s ease; }
        
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear { display: none; }
        input[type="password"]::-webkit-reveal { display: none; }

        .password-wrapper { position: relative; width: 100%; display: block; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-gray-500); padding: 0; display: flex; align-items: center; justify-content: center;}
        .toggle-password:hover { color: var(--color-pink-600); }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="admin-auth-card">
            <a href="/" class="logo">
                <img src="/logo.jpeg" class="logo-img" alt="Logo">
                <span class="logo-main">happiee</span> knots
            </a>
            <h2 class="heading-font">Create Account</h2>

            <form id="signupForm">
                <div class="admin-form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="admin-input" required placeholder="Enter your full name">
                </div>

                <div class="admin-form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="admin-input" required placeholder="Enter your email">
                </div>

                <div class="admin-form-group" style="margin-bottom: 2rem;">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="admin-input" required placeholder="Create a strong password" minlength="6" style="padding-right: 40px;">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: var(--radius-md); padding: 0.75rem; background-color: var(--color-pink-600); border: none; color: #fff; font-weight: 600; cursor: pointer;">Sign Up</button>
            </form>

            <div style="margin-top: 2rem; font-size: 0.9rem; color: var(--color-gray-600);">
                <p>Already have an account? <a href="/login" style="color: var(--color-pink-600); font-weight: 600; text-decoration: none;">Log in instead</a></p>
                <a href="/" style="display: inline-block; margin-top: 1rem; color: var(--color-gray-400); text-decoration: underline;">Return to Store</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const svg = btn.querySelector('svg');
            
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();

                if (data.success) {
                    alert('Account configured successfully! Navigating to signature login panel.');
                    // FIXED: Redirects directly to the login page so they can authenticate seamlessly
                    window.location.replace(window.location.origin + '/login');
                } else {
                    alert(data.message || 'Signup failed.');
                }
            } catch (err) {
                alert('Connection failure accessing authentication server.');
            }
        });
    </script>
</body>
</html>
