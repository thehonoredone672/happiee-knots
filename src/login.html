<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - happiee knots</title>
  <style>
    /* Identical theme system configuration */
    :root {
      --primary: #de1b76;
      --primary-hover: #c21465;
      --bg: #fff5f8;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border: #ffebf2;
      --text: #111827;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .brand {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: -0.05em;
    }

    .brand span {
      color: var(--primary);
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 32px;
      width: 100%;
      max-w: 400px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .auth-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      border: 1px solid #d1d5db;
      padding: 10px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.875rem;
    }

    .google-btn:hover {
      background: #f9fafb;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e5e7eb;
    }

    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .switch-text {
      text-align: center;
      font-size: 0.875rem;
      margin-top: 24px;
      color: #4b5563;
    }

    .switch-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .switch-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="brand">happiee <span>knots</span></div>

  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to access your custom hampers.</p>

    <button class="google-btn" onclick="continueWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.53-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.08 1.16-3.13 0-5.78-2.11-6.73-4.96H1.21v3.15C3.18 21.88 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24A7.16 7.16 0 0 1 4.8 12c0-.79.13-1.57.38-2.34V6.51H1.21A11.94 11.94 0 0 0 0 12c0 1.92.45 3.79 1.21 5.49l4.06-3.25z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 5.51l4.06 3.25c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      Log in with Google
    </button>

    <div class="divider">Or</div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn">Log In</button>
    </form>

    <p class="switch-text">
      Don't have an account? <a href="signup.html">Sign up</a>
    </p>
  </div>

  <script>
    function continueWithGoogle() {
      window.location.href = 'http://localhost:5000/api/auth/google';
    }

    async function handleLogin(event) {
      event.preventDefault();
      
      const bodyData = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await response.json();
        
        if (response.ok) {
          alert('Login Successful!');
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard'; 
        } else {
          alert(data.message || 'Invalid credentials.');
        }
      } catch (err) {
        alert('Could not connect to the authentication server.');
      }
    }
  </script>
</body>
</html>
