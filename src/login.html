<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - happiee knots</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>

    <div class="auth-card">
        <a href="/" class="brand-logo">happiee <span>knots</span></a>
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to manage your shopping bag and orders</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>

            <div class="form-options">
                <label style="display: flex; align-items: center; gap: 6px; color: #666; cursor: pointer;">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <div class="auth-footer">
            <p>New to happiee knots? <a href="signup.html">Create an account</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    alert('Logged in successfully!');
                    window.location.href = '/'; // Direct to landing screen
                } else {
                    alert(data.message || 'Login failed.');
                }
            } catch (err) {
                alert('Connection failure accessing authentication server.');
            }
        });
    </script>
</body>
</html>
